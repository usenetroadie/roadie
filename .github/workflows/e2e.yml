name: end-to-end

# Full unattended run of the wizard (tests/e2e/run.sh): real Docker, real images from
# versions.json, self-signed certificate and a fake indexer (test mode). Every supported
# system and architecture, with a DuckDNS address and with an own domain, and once as an
# update from the latest release.
on:
  workflow_dispatch:
  workflow_call:  # versions.yml: test a branch with newer images
    inputs:
      ref: {type: string, default: ""}
    secrets:
      TMDB_API_KEY: {required: false}
  schedule:
    - cron: "17 3 * * 1"  # weekly: notices when upstream changes break the pinned setup
  push:
    paths: ["roadie/data/versions.json"]

permissions:
  contents: read

jobs:
  server:
    # Ubuntu comes from Canonical's image server (the community one has no Ubuntu for LXD).
    # Every system runs as a fresh server in an LXD container on the runner: the runner's own
    # services (Docker, GitHub's outbound proxy on 127.0.0.2:443) cannot get in the way.
    name: ${{ matrix.image }} ${{ matrix.arch }} (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64, image: "ubuntu:24.04", mode: duckdns}
          - {runner: ubuntu-24.04, arch: x86_64, image: "ubuntu:24.04", mode: upgrade}  # latest release -> this commit
          - {runner: ubuntu-24.04-arm, arch: arm64, image: "ubuntu:24.04", mode: domain}
          - {runner: ubuntu-24.04, arch: x86_64, image: "images:debian/12", mode: duckdns}
          - {runner: ubuntu-24.04, arch: x86_64, image: "images:debian/13", mode: domain}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Week number (the LXD cache below is renewed weekly)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: LXD snaps from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/lxd-snaps
          key: lxd-snaps-${{ runner.arch }}-${{ steps.week.outputs.week }}
      - name: Fresh server in an LXD container
        run: |
          # The snap store is flaky; Incus 6.0 from apt is no way out (Docker does not start in it).
          # So the snaps are downloaded once a week and installed from the Actions cache.
          mkdir -p ~/lxd-snaps
          (  # in a subshell: the repository copy below must run from the checkout
            cd ~/lxd-snaps
            if ! ls lxd_*.snap >/dev/null 2>&1; then
              for try in 1 2 3 4 5 6; do snap download lxd && break; sleep 60; done
              base="$(unsquashfs -cat lxd_*.snap meta/snap.yaml | awk '/^base:/ {print $2}')"
              for try in 1 2 3 4 5 6; do snap download "$base" && break; sleep 60; done
            fi
            for f in *.assert; do sudo snap ack "$f"; done
            base="$(unsquashfs -cat lxd_*.snap meta/snap.yaml | awk '/^base:/ {print $2}')"
            snap list "$base" >/dev/null 2>&1 || sudo snap install ./"$base"_*.snap
            sudo snap install ./lxd_*.snap
          )
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT  # the runner's Docker would drop the container's traffic
          for try in 1 2 3; do sudo lxc launch "${{ matrix.image }}" srv -c security.nesting=true && break; sleep 30; done
          sudo lxc info srv >/dev/null  # stop here when no container could be started
          for i in $(seq 1 60); do sudo lxc exec srv -- getent hosts github.com >/dev/null && break; sleep 2; done
          # what a cloud image has and the minimal container image lacks
          sudo lxc exec srv -- bash -c 'apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q python3 curl ca-certificates openssh-server'
          tar -cf - --exclude=.git . | sudo lxc exec srv -- bash -c 'mkdir -p /root/roadie && tar -xf - -C /root/roadie'
      - name: TMDB key for the own AIOMetadata (repository secret; forks run without it)
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_KEY" ]; then
            printf %s "$TMDB_KEY" | sudo lxc exec srv -- sh -c 'umask 077; cat > /root/tmdb-key'
          fi
      - name: Setup, checks, second run, backup
        run: sudo lxc exec srv -- bash /root/roadie/tests/e2e/run.sh ${{ matrix.mode }}
      - name: Problem report (redacted) on failure
        if: failure()
        run: sudo lxc exec srv -- roadie diagnose || true
