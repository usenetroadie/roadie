name: end-to-end

# Full unattended run of the wizard (tests/e2e/run.sh): real Docker, real images from
# versions.json, self-signed certificate and a fake indexer (test mode). Every supported
# system and architecture, with a DuckDNS address and with an own domain, and once as an
# update from the latest release.
on:
  workflow_dispatch:
  workflow_call:  # versions.yml: test a branch with newer images
    inputs:
      ref: {type: string, default: ""}
    secrets:
      TMDB_API_KEY: {required: false}
  schedule:
    - cron: "17 3 * * 1"  # weekly: notices when upstream changes break the pinned setup
  push:
    paths: ["roadie/data/versions.json"]

permissions:
  contents: read

jobs:
  runner:
    name: ubuntu 24.04 ${{ matrix.arch }} (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64, mode: duckdns}
          - {runner: ubuntu-24.04, arch: x86_64, mode: upgrade}  # latest release -> this commit
          - {runner: ubuntu-24.04-arm, arch: arm64, mode: domain}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Prepare a "fresh" server (runners ship Docker; the wizard expects none)
        run: |
          sudo systemctl stop docker.socket docker.service containerd || true
          sudo apt-get purge -y -q docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin moby-* || true
          sudo rm -rf /var/lib/docker /etc/docker /usr/bin/docker /usr/libexec/docker
      - name: TMDB key for the own AIOMetadata (repository secret; forks run without it)
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_KEY" ]; then umask 077; printf %s "$TMDB_KEY" | sudo tee /root/tmdb-key >/dev/null; fi
      - name: Setup, checks, second run, backup
        run: sudo bash tests/e2e/run.sh ${{ matrix.mode }}
      - name: Problem report (redacted) on failure
        if: failure()
        run: sudo roadie diagnose || true

  debian:
    name: ${{ matrix.image }} (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: debian/12, mode: duckdns}
          - {image: debian/13, mode: domain}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Fresh Debian server in an LXD container
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT  # the runner's Docker would drop the container's traffic
          sudo lxc launch "images:${{ matrix.image }}" srv -c security.nesting=true
          for i in $(seq 1 60); do sudo lxc exec srv -- getent hosts deb.debian.org >/dev/null && break; sleep 2; done
          # what a Debian cloud image has and the minimal container image lacks
          sudo lxc exec srv -- bash -c 'apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q python3 curl ca-certificates openssh-server'
          tar -cf - --exclude=.git . | sudo lxc exec srv -- bash -c 'mkdir -p /root/roadie && tar -xf - -C /root/roadie'
      - name: TMDB key for the own AIOMetadata (repository secret; forks run without it)
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_KEY" ]; then
            printf %s "$TMDB_KEY" | sudo lxc exec srv -- sh -c 'umask 077; cat > /root/tmdb-key'
          fi
      - name: Setup, checks, second run, backup
        run: sudo lxc exec srv -- bash /root/roadie/tests/e2e/run.sh ${{ matrix.mode }}
      - name: Problem report (redacted) on failure
        if: failure()
        run: sudo lxc exec srv -- roadie diagnose || true
